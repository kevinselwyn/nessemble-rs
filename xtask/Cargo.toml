[package]
name = "xtask"
description = "Developer tasks for nessemble-rs (wasm build, VS Code extension packaging, site build, release changesets)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# The shared lexer/classifier, so the docs' static code blocks highlight through
# the exact same tokenizer as the editor and the LSP.
nessemble-core.workspace = true
# The host API catalog, rendered into the `script-api-toc` block of
# docs/src/extending.md by the `script-api` command; see
# plans/014-scripting-docs-and-tooling.md §4.
nessemble-script-api.workspace = true
# Parses/validates changeset files for the `changeset` command group (the
# release-orchestration tooling); see plans/004-release-orchestration.md.
changesets = "0.4"

[lints]
workspace = true
