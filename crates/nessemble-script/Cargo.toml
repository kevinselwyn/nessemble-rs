[package]
name = "nessemble-script"
description = "Custom pseudo-op scripting host (Rhai) for nessemble-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# `resolve_path_arg`/`PROJECT_ROOT_PREFIX` — the same `@/` resolution every
# other path-taking argument uses, so a script's own file API doesn't
# reimplement (and risk drifting from) the escape check. No cycle: nessemble-core
# does not depend on this crate.
nessemble-core.workspace = true
nessemble-media.workspace = true
# `internals` exposes the AST types the purity scan walks (see `purity`).
rhai = { version = "1", default-features = false, features = ["std", "internals"] }
rhai-fs = { version = "0.1.5", default-features = false, optional = true }
rhai-rand = { version = "0.1.6", default-features = false, features = ["float", "array"], optional = true }
# `parse_json`/`parse_json_file` (see `json`). Already a workspace dependency
# (`nessemble-cli`, `nessemble-core`'s dev-dependencies), so this adds nothing
# new the workspace does not already build.
serde_json.workspace = true

[features]
default = ["fs", "rand"]
# Filesystem access for scripts (`open_file`, `File` I/O) via `rhai-fs`. On by
# default; disabled for targets without a filesystem (e.g. `wasm32-unknown-unknown`),
# where scripts that call the file API get a clear "function not found" error.
fs = ["dep:rhai-fs"]
# Random-number functions (`rand`, `rand_float`, `shuffle`, …) for scripts via
# `rhai-rand`. On by default; disabled for targets without a system entropy
# source (e.g. `wasm32-unknown-unknown`), where the random functions are simply
# absent and calling one gives a clear "function not found" error.
rand = ["dep:rhai-rand"]
# Line coverage for scripts (`coverage` module): enables Rhai's debugger and AST
# walk. Off by default — only the `nessemble coverage --scripts` path needs it,
# and it is never used unless a debugger is explicitly registered, so ordinary
# script execution is unaffected.
coverage = ["rhai/debugging"]

[dev-dependencies]
# Encodes small PNGs for the `decode_png` tests.
image = { version = "0.25", default-features = false, features = ["png"] }
# The host API catalog, held against this crate's own registrations by
# `tests/api_catalog.rs`. A dev-dependency, not a dependency: the catalog reads
# the engine, never the other way round.
nessemble-script-api.workspace = true

[lints]
workspace = true
